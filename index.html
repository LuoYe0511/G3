<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>寂生 - Allothiri</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;color:#fff;font-family:"KaiTi","楷体",STKaiti,serif;
-webkit-tap-highlight-color:transparent;
}
html,body{height:100%;overflow:hidden;background:#0b0b0b;}

.wrap{width:100%;height:100%;position:relative;}

.page{
  width:100%;
  height:100vh;
  height:100dvh;
  position:absolute;
  top:0;
  left:0;
  background:#0b0b0b;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.7s ease;
  transform: translateZ(0);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}
.page.active{
  opacity:1;
  pointer-events:auto;
}

/* ========== 左侧竖GIF图片容器 ========== */
.gif-left{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:auto;
  z-index:1;
}
.gif-left img{
  height:100%;
  width:auto;
  display:block;
}

/* 中间文字区域 */
.page0-content{
  position:relative;
  z-index:2;
  text-align:center;
}
.page0-content .line-top{
  font-size:28px;
  margin-bottom:16px;
  letter-spacing:2px;
  text-align:left;
}
.page0-content .line-top span{
  display:block;
  text-align:right;
}
.page0-content .line-middle{
  font-size:24px;
  margin-bottom:32px;
  letter-spacing:2px;
  text-align:center;
}
.page0-content .divider{
  font-size:28px;
  color:#ffffff;
  letter-spacing:4px;
  margin-bottom:32px;
  opacity:1;
}

/* 导航按钮：方框包裹，字体加粗加深 */
.page-nav{
  display:flex;
  gap:12px;
  justify-content:center;
}
.page-nav button{
  background:transparent;
  border:1px solid #fff;
  padding:8px 18px;
  border-radius:4px;
  cursor:pointer;
  font-size:16px;
  color:#fff;
  font-weight:bold;
}
.page-nav button.active{
  background:rgba(255,255,255,0.2);
}

/* ========== 手机端适配 ========== */
@media (max-width:768px){
  .page{padding:20px;}
  .page0-content .line-top{font-size:22px;}
  .page0-content .line-middle{font-size:19px;}
  .page0-content .divider{font-size:22px;}
  .page-nav button{padding:6px 12px;font-size:14px;}
}
</style>
</head>
<body>
<div class="wrap">

<!-- 00 序章，默认active打开直接显示 -->
<div class="page active" id="page0">
  <!-- 左侧GIF -->
  <div class="gif-left">
    <img src="ezgif-115dd172c4a0c2a2.gif" alt="动画">
  </div>
  <div class="page0-content">
    <p class="line-top">一本书读第二次会有新感悟<span>但不会有新结局</span></p>
    <p class="line-middle">何可言 何能言 何处言</p>
    <div class="divider">——————————</div>
    <!-- 导航按钮居中，方框+加粗字体 -->
    <div class="page-nav">
      <button onclick="goPage(0)">序章</button>
      <button onclick="goPage(1)">人物</button>
      <button onclick="goPage(2)">须知</button>
      <button onclick="goPage(3)">情节</button>
    </div>
  </div>
</div>

<!-- JS页面切换 -->
<script>
const pages = document.querySelectorAll('.page');
const navBtns = document.querySelectorAll('.page-nav button');
function goPage(index){
  pages.forEach(p => p.classList.remove('active'));
  pages[index].classList.add('active');
  navBtns.forEach(b => b.classList.remove('active'));
  navBtns[index].classList.add('active');
}
</script>
</body>
