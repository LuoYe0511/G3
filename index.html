<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>寂生 - Allothiri</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;color:#f0f0f0;font-family:"PingFang SC",system-ui,serif;
-webkit-tap-highlight-color:transparent;
}
html,body{height:100%;overflow:hidden;background:#0b0b0b;}

.wrap{width:100%;height:100%;position:relative;}

.page{
  width:100%;
  height:100vh;
  height:100dvh;
  position:absolute;
  top:0;
  left:0;
  background:#0b0b0b;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.7s ease;
  transform: translateZ(0);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}
.page.active{
  opacity:1;
  pointer-events:auto;
}

/* ========== 左侧竖GIF图片容器 ========== */
.gif-left{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:auto;
  z-index:1;
}
.gif-left img{
  height:100%;
  width:auto;
  display:block;
}

/* 中间文字区域 */
.page0-content{
  position:relative;
  z-index:2;
  text-align:center;
}
.page0-content .line1{font-size:28px;margin-bottom:16px;opacity:0.9;letter-spacing:2px;}
.page0-content .line2{font-size:24px;margin-bottom:32px;opacity:0.8;letter-spacing:2px;}

/* 导航按钮，放到文字下方 */
.page-nav{
  display:flex;
  gap:6px;
  justify-content:center;
}
.page-nav button{
  background:transparent;
  border:none;
  padding:7px 16px;
  border-radius:999px;
  cursor:pointer;
  font-size:14px;
  opacity:0.75;
}
.page-nav button.active{
  background:rgba(255,255,255,0.18);
  opacity:1;
}

/* 底部翻页控件 */
.bottom-pager{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:20px;
  z-index:99;
}
.arrow{
  width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.3);
  background:transparent;color:#fff;
  cursor:pointer;
}
.page-text-num{font-size:14px;opacity:0.7;letter-spacing:1px;}

/* ========== 签名：移到页面底部居中 ========== */
.footer-signature{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  font-size:12px;
  opacity:0.55;
  line-height:1.6;
}

/* ========== 手机端适配 ========== */
@media (max-width:768px){
  .page{padding:20px;}
  .page0-content .line1{font-size:22px;}
  .page0-content .line2{font-size:19px;}
  .page-nav button{padding:5px 10px;font-size:12px;}
  .footer-signature{font-size:10px;}
}
</style>
</head>
<body>
<div class="wrap">

<!-- 00 序章，默认active打开直接显示 -->
<div class="page active" id="page0">
  <!-- 左侧GIF -->
  <div class="gif-left">
    <img src="ezgif-115dd172c4a0c2a2.gif" alt="动画">
  </div>
  <div class="page0-content">
    <p class="line1">一本书读第二次会有新感悟 但不会有新结局</p>
    <p class="line2">何可言 何能言 何处言</p>
    <!-- 导航按钮移到文案下方：序章 人物 须知 情节 -->
    <div class="page-nav">
      <button onclick="goPage(0)">序章</button>
      <button onclick="goPage(1)">人物</button>
      <button onclick="goPage(2)">须知</button>
      <button onclick="goPage(3)">情节</button>
    </div>
  </div>
</div>

<!-- JS页面切换 -->
<script>
const pages = document.querySelectorAll('.page');
const navBtns = document.querySelectorAll('.page-nav button');
function goPage(index){
  pages.forEach(p => p.classList.remove('active'));
  pages[index].classList.add('active');
  navBtns.forEach(b => b.classList.remove('active'));
  navBtns[index].classList.add('active');
}
</script>
</body>
