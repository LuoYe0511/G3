<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>寂生 - Allothiri</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;color:#fff;font-family:"KaiTi","楷体",STKaiti,serif;
-webkit-tap-highlight-color:transparent;
}
html,body{height:100%;overflow:hidden;background:#0b0b0b;}

.wrap{width:100%;height:100%;position:relative;}

.page{
  width:100%;
  height:100vh;
  height:100dvh;
  position:absolute;
  top:0;
  left:0;
  background:#0b0b0b;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.7s ease;
  transform: translateZ(0);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}
.page.active{
  opacity:1;
  pointer-events:auto;
}

/* ========== 开场 ●序章 动画 白色楷体 ========== */
.opening-title{
  position:absolute;
  z-index:100;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b0b;
  font-size:72px;
  letter-spacing:12px;
  color:#ffffff;
  font-family:"KaiTi","楷体",STKaiti,serif;
  opacity:1;
  animation: fadeOut 2.5s ease-in forwards;
}
@keyframes fadeOut {
  0%{opacity:1;}
  68%{opacity:1;}
  100%{opacity:0;pointer-events:none;}
}

/* ========== 左侧竖GIF图片容器 ========== */
.gif-left{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:auto;
  z-index:1;
}
.gif-left img{
  height:100%;
  width:auto;
  display:block;
}

/* 中间文字区域 */
.page0-content{
  position:relative;
  z-index:2;
  text-align:center;
}

/* 两行文案错开叠放：第一行靠左，第二行靠右 */
.stagger-text{
  position:relative;
  width:100%;
  max-width:640px;
  margin:0 auto 40px;
}
.stagger-text .line1{
  font-size:28px;
  letter-spacing:2px;
  text-align:left;
  opacity:0.92;
}
.stagger-text .line2{
  font-size:28px;
  letter-spacing:2px;
  text-align:right;
  margin-top:4px;
  opacity:1;
}

/* 下方居中文案 */
.line-middle{
  font-size:24px;
  margin-bottom:40px;
  letter-spacing:2px;
  text-align:center;
}

/* 导航按钮：方框包裹，字体加深 */
.page-nav{
  display:flex;
  gap:12px;
  justify-content:center;
}
.page-nav button{
  background:transparent;
  border:1px solid #fff;
  padding:8px 18px;
  border-radius:4px;
  cursor:pointer;
  font-size:16px;
  color:#fff;
  font-weight:bold;
}
.page-nav button.active{
  background:rgba(255,255,255,0.2);
}

/* ========== 手机端适配 ========== */
@media (max-width:768px){
  .page{padding:20px;}
  .opening-title{font-size:48px;}
  .stagger-text .line1{font-size:22px;}
  .stagger-text .line2{font-size:22px;}
  .line-middle{font-size:19px;}
  .page-nav button{padding:6px 12px;font-size:14px;}
}
</style>
</head>
<body>
<div class="wrap">
<!-- 开场文字：●序章，白色楷体 -->
<div class="opening-title">●序章</div>

<!-- 00 序章 -->
<div class="page active" id="page0">
  <div class="gif-left">
    <img src="ezgif-115dd172c4a0c2a2.gif" alt="动画">
  </div>

  <div class="page0-content">
    <!-- 两行错开叠放，不要横线 -->
    <div class="stagger-text">
      <p class="line1">一本书读第二次会有新感悟</p>
      <p class="line2">但不会有新结局</p>
    </div>

    <p class="line-middle">何可言 何能言 何处言</p>

    <div class="page-nav">
      <button onclick="goPage(0)">序章</button>
      <button onclick="goPage(1)">人物</button>
      <button onclick="goPage(2)">须知</button>
      <button onclick="goPage(3)">情节</button>
    </div>
  </div>
</div>

<script>
const pages = document.querySelectorAll('.page');
const navBtns = document.querySelectorAll('.page-nav button');
function goPage(index){
  pages.forEach(p => p.classList.remove('active'));
  pages[index].classList.add('active');
  navBtns.forEach(b => b.classList.remove('active'));
  navBtns[index].classList.add('active');
}
</script>
</div>
</body>
