<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>寂生 - Allothiri</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  color:#fff;
  font-family:"KaiTi","楷体",STKaiti,serif;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  height:100%;
  overflow:hidden;
  background:#0b0b0b;
}

.wrap{
  width:100%;
  height:100%;
  position:relative;
}

/* ========== 首页封面 ========== */
.cover-wrap{
  position:absolute;
  z-index:200;
  width:100%;
  height:100%;
  background:#0b0b0b;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition: opacity 1s ease;
}
.cover-wrap.fade-out{
  opacity:0;
  pointer-events:none;
}
.cover-inner{
  position:relative;
  max-width:70%;
  max-height:70vh;
}
.cover-img{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
}
.cover-note{
  position:absolute;
  right:12px;
  bottom:12px;
  text-align:right;
  line-height:1.6;
}
.cover-cn{
  display:block;
  color:#ffffff;
  font-size:20px;
  text-shadow: 0 2px 8px #000;
}
.cover-en{
  display:block;
  color:#ff2b2b;
  font-size:16px;
  font-family: sans-serif;
  text-shadow: 0 2px 8px #000;
}
.tip-text{
  position:absolute;
  bottom:80px;
  width:100%;
  text-align:center;
  font-size:16px;
  color:#fff;
  opacity:0.6;
  z-index:210;
}

/* ========== 序章页面 默认隐藏 ========== */
.page{
  width:100%;
  height:100vh;
  height:100dvh;
  position:absolute;
  top:0;
  left:0;
  background:#0b0b0b;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.7s ease;
  transform: translateZ(0);
}
.page.active{
  opacity:1;
  pointer-events:auto;
}

/* ========== 序章开场遮罩 总时长4秒 ========== */
.opening-wrap{
  position:absolute;
  z-index:100;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#0b0b0b;
  animation: fadeOutOpening 4s ease-in forwards;
}

.opening-title{
  display:flex;
  align-items:baseline;
  justify-content:center;
  animation: titleShow 4s ease forwards;
}
.opening-dot{
  color:#ffffff;
  font-size:64px;
  margin-right:12px;
}
.opening-text{
  color:#ffffff;
  font-size:72px;
  letter-spacing:12px;
}
.opening-en{
  color:#ffffff;
  font-family: sans-serif;
  font-size:32px;
  margin-top:18px;
  letter-spacing:-1px;
}
.opening-note{
  color:#ffffff;
  font-size:16px;
  margin-top:10px;
}

@keyframes titleShow{
  0%{opacity:0;}
  15%{opacity:1;}
  85%{opacity:1;}
  100%{opacity:0;}
}
@keyframes fadeOutOpening {
  0%{opacity:1;}
  85%{opacity:1;}
  100%{opacity:0;pointer-events:none;}
}

/* ========== 序章背景图 CSS背景 ========== */
.bg-img{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:70vh;
  background-image:url("IMG_7221.PNG");
  background-size:cover;
  background-position:center top;
  z-index:1;
}

/* ========== 图片上文字层 ========== */
.img-text-wrap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:70vh;
  z-index:2;
}

.line-top{
  position:absolute;
  top:8%;
  width:100%;
  text-align:center;
  font-size:23px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay: 0.4s;
}

.txt-memory{
  position:absolute;
  top:22%;
  left:6%;
  font-size:21px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay:1.4s;
}

.txt-emotion{
  position:absolute;
  top:40%;
  right:6%;
  font-size:21px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay:2.4s;
}

.txt-bond{
  position:absolute;
  top:58%;
  left:6%;
  font-size:21px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay:3.4s;
}

.txt-lock{
  position:absolute;
  top:76%;
  width:100%;
  text-align:center;
  font-size:21px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay:4.4s;
}

/* ========== 底部黑色区域30vh ========== */
.bottom-area{
  position:absolute;
  top:70vh;
  left:0;
  width:100%;
  height:30vh;
  background:#0b0b0b;
  z-index:1;
}
.bottom-text{
  position:absolute;
  top:30px;
  width:100%;
  text-align:center;
  z-index:2;
  font-size:21px;
  opacity:0.9;
}

/* ========== 底部导航【横向长椭圆白边框】 ========== */
.page-nav{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:3;
  border:1px solid #ffffff;
  border-radius:9999px;
  padding:12px 24px;
  display:flex;
  gap:16px;
  align-items:center;
  background:transparent;
}

.page-nav button{
  background:transparent;
  border:none;
  padding:6px 14px;
  border-radius:999px;
  cursor:pointer;
  font-size:16px;
  color:#fff;
  font-weight:bold;
  white-space:nowrap;
}

.page-nav button.active{
  background:rgba(255,255,255,0.22);
}

@keyframes fadeInUp{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ========== 手机端适配 ========== */
@media (max-width:768px){
  .opening-dot{font-size:44px;}
  .opening-text{font-size:48px;}
  .opening-en{font-size:24px;letter-spacing:-0.5px;}
  .opening-note{font-size:14px;}

  .bg-img{
    height:68vh;
  }
  .img-text-wrap{
    height:68vh;
  }

  .line-top{
    top:8%;
    font-size:20px;
  }
  .txt-memory{
    top:22%;
    left:6%;
    font-size:18px;
  }
  .txt-emotion{
    top:40%;
    right:6%;
    font-size:18px;
  }
  .txt-bond{
    top:58%;
    left:6%;
    font-size:18px;
  }
  .txt-lock{
    top:76%;
    font-size:18px;
  }

  .bottom-area{
    top:68vh;
    height:32vh;
  }
  .bottom-text{
    top:24px;
    font-size:18px;
  }

  .page-nav{
    bottom:18px;
    padding:10px 18px;
    gap:10px;
  }
  .page-nav button{
    padding:5px 10px;
    font-size:14px;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <!-- 封面首页 -->
  <div class="cover-wrap" id="coverPage">
    <div class="cover-inner">
      <img src="IMG_7232.JPG" class="cover-img" alt="封面">
      <div class="cover-note">
        <span class="cover-cn">请谨慎阅读此书</span>
        <span class="cover-en">Please read this book with caution.</span>
      </div>
    </div>
    <p class="tip-text">点击屏幕进入序章</p>
  </div>

  <!-- 序章主页面 -->
  <div class="page" id="mainPage">
    <div class="opening-wrap">
      <!-- 序章标题组 -->
      <div class="opening-title">
        <span class="opening-dot">●</span>
        <span class="opening-text">序章</span>
      </div>
      <p class="opening-en">Allothiri</p>
      <p class="opening-note">死无葬身之地</p>
    </div>

    <div class="bg-img"></div>

    <div class="img-text-wrap">
      <p class="line-top">人类无法飞翔是因为心太重吗</p>
      <p class="txt-memory">回忆</p>
      <p class="txt-emotion">情感</p>
      <p class="txt-bond">羁绊</p>
      <p class="txt-lock">铸成枷锁</p>
    </div>

    <div class="bottom-area">
      <p class="bottom-text">飞翔。或许也是一种痛苦？</p>

      <div class="page-nav">
        <button onclick="goPage(0)">序章</button>
        <button onclick="goPage(1)">人物</button>
        <button onclick="goPage(2)">须知</button>
        <button onclick="goPage(3)">情节</button>
      </div>
    </div>
  </div>

</div>

<script>
// 封面点击进入序章
document.getElementById('coverPage').addEventListener('click', function(){
  this.classList.add('fade-out');
  setTimeout(() => {
    this.style.display = 'none';
    document.getElementById('mainPage').classList.add('active');
  }, 1000);
});

// 页面切换
function goPage(index){
  const pages = document.querySelectorAll('.page');
  pages.forEach(p => p.classList.remove('active'));
  pages[index].classList.add('active');
}
</script>

</body>
</html>
