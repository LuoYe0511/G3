<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>寂生 - Allothiri</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  color:#fff;
  font-family:"KaiTi","楷体",STKaiti,serif;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  height:100%;
  overflow:hidden;
  background:#0b0b0b;
}

.wrap{
  width:100%;
  height:100%;
  position:relative;
}

.page{
  width:100%;
  height:100vh;
  height:100dvh;
  position:absolute;
  top:0;
  left:0;
  background:#0b0b0b;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.7s ease;
  transform: translateZ(0);
}

.page.active{
  opacity:1;
  pointer-events:auto;
}

/* ========== 开场页 ========== */
.opening-wrap{
  position:absolute;
  z-index:100;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#0b0b0b;
  opacity:1;
  animation: fadeOut 2.8s ease-in forwards;
}

@keyframes fadeOut {
  0%{opacity:1;}
  70%{opacity:1;}
  100%{opacity:0;pointer-events:none;}
}

.opening-title{
  display:flex;
  align-items:baseline;
  justify-content:center;
}

.opening-dot{
  color:#ffffff;
  font-size:64px;
  margin-right:12px;
}

.opening-text{
  color:#ff2b2b;
  font-size:72px;
  letter-spacing:12px;
}

.opening-en{
  color:#ffffff;
  font-family: sans-serif;
  font-size:32px;
  margin-top:18px;
  letter-spacing:-1px;
}

.opening-note{
  color:#ffffff;
  font-size:16px;
  margin-top:10px;
  opacity:0.85;
  letter-spacing:2px;
}

/* ========== 背景图：放大到70vh ========== */
.bg-img{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:70vh;
  object-fit:cover;
  object-position:center top;
  z-index:1;
}

/* ========== 图片内文字容器 ========== */
.img-text-wrap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:70vh;
  z-index:2;
}

/* 顶部标题：居中 */
.line-top{
  position:absolute;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  text-align:center;
  font-size:23px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay: 0.4s;
}

/* 回忆：22%高度，左6% */
.txt-memory{
  position:absolute;
  top:22%;
  left:6%;
  font-size:21px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay:1.4s;
}

/* 情感：40%高度，右6% */
.txt-emotion{
  position:absolute;
  top:40%;
  right:6%;
  font-size:21px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay:2.4s;
}

/* 羁绊：58%高度，左6% */
.txt-bond{
  position:absolute;
  top:58%;
  left:6%;
  font-size:21px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay:3.4s;
}

/* 铸成枷锁：76%高度，居中 */
.txt-lock{
  position:absolute;
  top:76%;
  left:50%;
  width:100%;
  transform:translateX(-50%);
  text-align:center;
  font-size:21px;
  text-shadow: 0 2px 10px #000;
  opacity:0;
  animation: fadeInUp 1s ease forwards;
  animation-delay:4.4s;
}

/* ========== 下方黑色区域：30% ========== */
.bottom-area{
  position:absolute;
  top:70vh;
  left:0;
  width:100%;
  height:30vh;
  background:#0b0b0b;
  z-index:1;
}

.bottom-text{
  position:absolute;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  text-align:center;
  z-index:2;
  font-size:21px;
  opacity:0.9;
}

/* ========== 底部导航按钮 ========== */
.page-nav{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
  z-index:3;
}

.page-nav button{
  background:transparent;
  border:1px solid #fff;
  padding:8px 18px;
  border-radius:4px;
  cursor:pointer;
  font-size:16px;
  color:#fff;
  font-weight:bold;
}

.page-nav button.active{
  background:rgba(255,255,255,0.2);
}

/* ========== 动画 ========== */
@keyframes fadeInUp{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ========== 手机端适配 ========== */
@media (max-width:768px){
  .opening-dot{font-size:44px;}
  .opening-text{font-size:48px;}
  .opening-en{font-size:24px;letter-spacing:-0.5px;}
  .opening-note{font-size:14px;}

  .bg-img{
    height:68vh;
  }
  .img-text-wrap{
    height:68vh;
  }

  .line-top{
    top:8%;
    font-size:20px;
  }
  .txt-memory{
    top:22%;
    left:6%;
    font-size:18px;
  }
  .txt-emotion{
    top:40%;
    right:6%;
    font-size:18px;
  }
  .txt-bond{
    top:58%;
    left:6%;
    font-size:18px;
  }
  .txt-lock{
    top:76%;
    font-size:18px;
  }

  .bottom-area{
    top:68vh;
    height:32vh;
  }
  .bottom-text{
    top:24px;
    font-size:18px;
  }

  .page-nav{
    bottom:18px;
  }
  .page-nav button{
    padding:6px 12px;
    font-size:14px;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <!-- 开场页 -->
  <div class="opening-wrap">
    <div class="opening-title">
      <span class="opening-dot">●</span>
      <span class="opening-text">序章</span>
    </div>
    <p class="opening-en">Allothiri</p>
    <p class="opening-note">死无葬身之地</p>
  </div>

  <!-- 00 序章 -->
  <div class="page active" id="page0">

    <img src="IMG_7221.PNG" class="bg-img" alt="背景">

    <div class="img-text-wrap">
      <p class="line-top">人类无法飞翔是因为心太重吗</p>
      <p class="txt-memory">回忆</p>
      <p class="txt-emotion">情感</p>
      <p class="txt-bond">羁绊</p>
      <p class="txt-lock">铸成枷锁</p>
    </div>

    <div class="bottom-area">
      <p class="bottom-text">飞翔。或许也是一种痛苦？</p>

      <div class="page-nav">
        <button onclick="goPage(0)">序章</button>
        <button onclick="goPage(1)">人物</button>
        <button onclick="goPage(2)">须知</button>
        <button onclick="goPage(3)">情节</button>
      </div>
    </div>

  </div>

</div>

<script>
const pages = document.querySelectorAll('.page');
const navBtns = document.querySelectorAll('.page-nav button');

function goPage(index){
  pages.forEach(p => p.classList.remove('active'));
  pages[index].classList.add('active');
  navBtns.forEach(b => b.classList.remove('active'));
}
</script>

</body>
</html>
