<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>寂生 - Allothiri</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;color:#f0f0f0;font-family:"PingFang SC",system-ui,serif;
-webkit-tap-highlight-color:transparent;
}
html,body{height:100%;overflow:hidden;background:#0b0b0b;}

.wrap{width:100%;height:100%;position:relative;}

.page{
  width:100%;
  height:100vh;
  height:100dvh;
  position:absolute;
  top:0;
  left:0;
  background:#0b0b0b;
  background-size:cover;
  background-position:center;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.7s ease;
  transform: translateZ(0);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}
.page.active{
  opacity:1;
  pointer-events:auto;
}

/* ========== 序章页GIF：靠左，垂直居中 ========== */
#page0{
  background-image:url("ezgif-115dd172c4a0c2a2.gif");
  background-size:auto 100%;
  background-position:left center;
  background-repeat:no-repeat;
  box-shadow: inset 0 0 0 100vw rgba(0,0,0,0.55);
}

/* 右上角导航栏 【序章 人物 情节 须知】 */
.top-nav{
  position:fixed;
  top:22px;
  right:24px;
  z-index:99;
  display:flex;
  gap:6px;
  background:rgba(255,255,255,0.08);
  padding:5px;
  border-radius:999px;
}
.top-nav button{
  background:transparent;
  border:none;
  padding:7px 16px;
  border-radius:999px;
  cursor:pointer;
  font-size:14px;
  opacity:0.75;
}
.top-nav button.active{
  background:rgba(255,255,255,0.18);
  opacity:1;
}

/* 底部翻页控件 */
.bottom-pager{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:20px;
  z-index:99;
}
.arrow{
  width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.3);
  background:transparent;color:#fff;
  cursor:pointer;
}
.page-text-num{font-size:14px;opacity:0.7;letter-spacing:1px;}

/* ========== 签名：移到页面底部居中 ========== */
.footer-signature{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  font-size:12px;
  opacity:0.55;
  line-height:1.6;
}

/* ========== 序章页面文案 ========== */
.page0-content{text-align:center;}
.page0-content .main-line{font-size:28px;margin-bottom:12px;opacity:0.9;letter-spacing:2px;}
</style>
</head>
<body>
<div class="wrap">
<!-- 右上角导航：序章 人物 情节 须知 -->
<div class="top-nav">
<button onclick="goPage(0)">序章</button>
<button onclick="goPage(1)">人物</button>
<button onclick="goPage(2)">情节</button>
<button onclick="goPage(3)">须知</button>
</div>

<!-- 00 序章 -->
<div class="page" id="page0">
<div class="page0-content">
<p class="main-line">缓缓飘落的枫叶像思念</p>
</div>
</div>
