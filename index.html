<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>寂生 - Allothiri</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;color:#fff;font-family:"KaiTi","楷体",STKaiti,serif;
-webkit-tap-highlight-color:transparent;
}
html,body{height:100%;overflow:hidden;background:#0b0b0b;}

.wrap{width:100%;height:100%;position:relative;}

.page{
  width:100%;
  height:100vh;
  height:100dvh;
  position:absolute;
  top:0;
  left:0;
  background:#0b0b0b;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.7s ease;
  transform: translateZ(0);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}
.page.active{
  opacity:1;
  pointer-events:auto;
}

/* ========== 开场页：白色● + 红色序章 + Allothiri + 注解 ========== */
.opening-wrap{
  position:absolute;
  z-index:100;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#0b0b0b;
  opacity:1;
  animation: fadeOut 2.8s ease-in forwards;
}
@keyframes fadeOut {
  0%{opacity:1;}
  70%{opacity:1;}
  100%{opacity:0;pointer-events:none;}
}

.opening-title{
  display:flex;
  align-items:baseline;
  justify-content:center;
  font-family:"KaiTi","楷体",STKaiti,serif;
}
.opening-dot{
  color:#ffffff;
  font-size:64px;
  margin-right:12px;
}
.opening-text{
  color:#ff2b2b;
  font-size:72px;
  letter-spacing:12px;
}
.opening-en{
  color:#ffffff;
  font-family: sans-serif; /*普通无衬线英文*/
  font-size:32px; /*放大，小于序章72px*/
  margin-top:18px;
  letter-spacing:-1px; /*紧凑，缩小字间距*/
}
.opening-note{
  color:#ffffff;
  font-size:16px;
  margin-top:10px;
  opacity:0.85;
  letter-spacing:2px;
}

/* ========== 顶部图片：宽度铺满，占屏幕上半区 ========== */
.top-image{
  position:absolute;
  top:38%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:2;
  width:100%;
  max-width:100%;
  max-height:50vh;
  object-fit:cover;
  object-position:center top;
}

/* 中间文字区域，随图片上移 */
.page0-content{
  position:absolute;
  top:calc(38% + 50vh * 0.5);
  left:50%;
  transform:translate(-50%,-50%);
  z-index:3;
  text-align:center;
  width:100%;
  padding:0 20px;
}

/* 主文案全部居中【字号调小】 */
.main-text{
  position:relative;
  width:100%;
  max-width:640px;
  margin:0 auto 40px;
}
.main-text .line1{
  font-size:24px;
  letter-spacing:2px;
  text-align:center;
  opacity:0.92;
}
.main-text .line2{
  font-size:24px;
  letter-spacing:2px;
  text-align:center;
  margin-top:12px;
  opacity:0.92;
}
.main-text .line3{
  font-size:24px;
  letter-spacing:2px;
  text-align:center;
  margin-top:12px;
  opacity:1;
}

/* 下方文案：飞翔.或许也是一种痛苦？【字号调小】 */
.line-middle{
  font-size:20px;
  margin-bottom:40px;
  letter-spacing:2px;
  text-align:center;
}

/* 导航按钮：方框包裹，字体加深 */
.page-nav{
  display:flex;
  gap:12px;
  justify-content:center;
}
.page-nav button{
  background:transparent;
  border:1px solid #fff;
  padding:8px 18px;
  border-radius:4px;
  cursor:pointer;
  font-size:16px;
  color:#fff;
  font-weight:bold;
}
.page-nav button.active{
  background:rgba(255,255,255,0.2);
}

/* ========== 手机端适配 ========== */
@media (max-width:768px){
  .page{padding:20px;}
  .opening-dot{font-size:44px;}
  .opening-text{font-size:48px;}
  .opening-en{font-size:24px;letter-spacing:-0.5px;}
  .opening-note{font-size:14px;}

  .top-image{
    top:36%;
    width:100%;
    max-width:100%;
    max-height:50vh;
  }

  .page0-content{
    top:calc(36% + 50vh * 0.5);
  }

  .main-text .line1{font-size:20px;}
  .main-text .line2{font-size:20px;}
  .main-text .line3{font-size:20px;}
  .line-middle{font-size:17px;}
  .page-nav button{padding:6px 12px;font-size:14px;}
}
</style>
</head>
<body>
<div class="wrap">

<!-- 开场页 -->
<div class="opening-wrap">
  <div class="opening-title">
    <span class="opening-dot">●</span>
    <span class="opening-text">序章</span>
  </div>
  <p class="opening-en">Allothiri</p>
  <p class="opening-note">死无葬身之地</p>
</div>

<!-- 00 序章 -->
<div class="page active" id="page0">
  <!-- 静态图：铺满宽度，占屏幕上半部分 -->
  <img src="IMG_7221.PNG" alt="顶部图片" class="top-image">

  <!-- 文字在图片下方 -->
  <div class="page0-content">
    <div class="main-text">
      <p class="line1">人类无法飞翔是因为心太重吗</p>
      <p class="line2">回忆 情感 羁绊</p>
      <p class="line3">铸成枷锁</p>
    </div>

    <p class="line-middle">飞翔.或许也是一种痛苦？</p>

    <div class="page-nav">
      <button onclick="goPage(0)">序章</button>
      <button onclick="goPage(1)">人物</button>
      <button onclick="goPage(2)">须知</button>
      <button onclick="goPage(3)">情节</button>
    </div>
  </div>
</div>

<script>
const pages = document.querySelectorAll('.page');
const navBtns = document.querySelectorAll('.page-nav button');
function goPage(index){
  pages.forEach(p => p.classList.remove('active'));
  pages[index].classList.add('active');
  navBtns.forEach(b => b.classList.remove('active'));
}
</script>
</div>
</body>
